<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password - LearnFlow</title>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    input { width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; background: #4F46E5; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 650; cursor: pointer; }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Set New Password</h2>
    <form id="updatePasswordForm">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" required placeholder="Enter new password">
      <button type="submit">Update Password</button>
    </form>
  </div>

  <!-- Include your Supabase JS client configuration -->
  <script src="supabaseClient.js"></script>
  <script>
    document.getElementById('updatePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;

      const { data, error } = await supabaseClient.auth.updateUser({
        password: newPassword
      });

      if (error) {
        alert("Error updating password: " + error.message);
      } else {
        alert("Password successfully updated! Redirecting to login...");
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
