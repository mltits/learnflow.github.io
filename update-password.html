<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFlow | Set New Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center px-4 text-gray-800">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <a href="index.html" class="inline-block text-2xl font-extrabold bg-gradient-to-r from-green-600 to-emerald-500 bg-clip-text text-transparent">LearnFlow</a>
            <h2 class="text-xl font-bold text-gray-800 mt-2">Set New Password</h2>
            <p class="text-gray-500 text-sm mt-1">Enter your new password below</p>
        </div>

        <div id="error-msg" class="hidden mb-4 p-3.5 bg-red-100 text-red-700 text-sm font-medium rounded-xl"></div>
        <div id="success-msg" class="hidden mb-4 p-3.5 bg-green-100 text-green-700 text-sm font-medium rounded-xl"></div>

        <form id="updatePasswordForm" class="space-y-4">
            <div>
                <label for="newPassword" class="block text-sm font-semibold text-gray-700 mb-1">New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="Minimum 6 characters" class="w-full p-3 border border-gray-300 rounded-xl text-base focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <button type="submit" id="update-btn" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl text-base hover:bg-green-700 transition shadow-md">
                Update Password
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-100 text-center">
            <a href="login.html" class="text-sm font-medium text-gray-500 hover:text-green-600 transition">&larr; Back to Login</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ztsiddiimopotsffuxms.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NrRZIYGQmBZVBMxbeIp-eA_ggLHNGzL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('updatePasswordForm');
        const updateBtn = document.getElementById('update-btn');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        // Verify a recovery session exists when the page loads
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                // Give Supabase a moment to parse the URL hash/code if just redirected
                supabaseClient.auth.onAuthStateChange((event, currentSession) => {
                    if (event === 'PASSWORD_RECOVERY' || currentSession) {
                        errorMsg.classList.add('hidden');
                    }
                });
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            const newPassword = document.getElementById('newPassword').value;
            updateBtn.disabled = true;
            updateBtn.textContent = 'Updating...';

            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                errorMsg.textContent = error.message + ' (Make sure you opened this page from a fresh password reset email link.)';
                errorMsg.classList.remove('hidden');
                updateBtn.disabled = false;
                updateBtn.textContent = 'Update Password';
            } else {
                successMsg.textContent = 'Password updated successfully! Redirecting to login...';
                successMsg.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
