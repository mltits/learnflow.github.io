<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFlow | Login & Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; font-size: 16px; }
    </style>
</head>
<body class="bg-emerald-50 flex items-center justify-center min-h-screen antialiased text-gray-800 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <a href="index.html" class="inline-block text-2xl font-extrabold bg-gradient-to-r from-green-600 to-emerald-500 bg-clip-text text-transparent">LearnFlow Portal</a>
            <p class="text-gray-500 text-sm mt-1">Log in to book and manage your classes</p>
        </div>

        <div id="error-msg" class="hidden mb-4 p-3.5 bg-red-100 text-red-700 text-sm font-medium rounded-xl"></div>
        <div id="success-msg" class="hidden mb-4 p-3.5 bg-green-100 text-green-700 text-sm font-medium rounded-xl"></div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full p-3 border border-gray-300 rounded-xl text-base focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-3 border border-gray-300 rounded-xl text-base focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl text-base hover:bg-green-700 transition shadow-md">
                Log In
            </button>
        </form>

        <div class="mt-5 text-center">
            <button id="toggle-mode" class="text-sm font-semibold text-green-600 hover:underline">Don't have an account? Sign up</button>
        </div>
        <div class="mt-6 pt-4 border-t border-gray-100 text-center">
            <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-green-600 transition">← Back to Home</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ztsiddiimopotsffuxms.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NrRZIYGQmBZVBMxbeIp-eA_ggLHNGzL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;
        const form = document.getElementById('auth-form');
        const toggleBtn = document.getElementById('toggle-mode');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        toggleBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            submitBtn.textContent = isSignUp ? 'Sign Up' : 'Log In';
            toggleBtn.textContent = isSignUp ? 'Already have an account? Log in' : "Don't have an account? Sign up";
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    errorMsg.textContent = error.message;
                    errorMsg.classList.remove('hidden');
                } else {
                    successMsg.textContent = 'Sign up successful! Check your email for confirmation or log in.';
                    successMsg.classList.remove('hidden');
                }
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    errorMsg.textContent = error.message;
                    errorMsg.classList.remove('hidden');
                } else {
                    window.location.href = 'booking.html';
                }
            }
        });
    </script>
</body>
</html>
