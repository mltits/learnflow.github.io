<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFlow | My Bookings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-emerald-50 min-h-screen text-gray-800">
    <!-- Top Nav -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-2xl font-extrabold bg-gradient-to-r from-green-600 to-emerald-500 bg-clip-text text-transparent">LearnFlow</span>
                <span class="text-xs bg-green-100 text-green-700 px-2.5 py-0.5 rounded-full font-semibold">Student Portal</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="booking.html" class="bg-green-600 text-white text-sm font-bold px-4 py-2 rounded-xl hover:bg-green-700 transition">
                    + Book New Class
                </a>
                <button id="logout-btn" class="text-sm font-semibold text-red-600 hover:underline">
                    Log Out
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Dashboard -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900">My Scheduled Classes</h1>
                <p id="user-email-display" class="text-sm text-gray-500 mt-1">Loading account...</p>
            </div>
            <a href="index.html" class="text-sm text-green-700 hover:underline mt-3 sm:mt-0">← Back to Website</a>
        </div>

        <div id="status-msg" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

        <!-- Loading Skeleton -->
        <div id="loading-state" class="bg-white p-8 rounded-2xl shadow-sm text-center text-gray-500">
            Fetching your bookings...
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden bg-white p-12 rounded-2xl shadow-sm text-center">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                📅
            </div>
            <h2 class="text-xl font-bold text-gray-800">No classes booked yet</h2>
            <p class="text-gray-500 mt-2 max-w-md mx-auto">Ready to start learning? Schedule your first 1:1 session with one of our expert tutors.</p>
            <a href="booking.html" class="inline-block mt-6 bg-green-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-green-700 transition">
                Book Your First Class
            </a>
        </div>

        <!-- Bookings Grid -->
        <div id="bookings-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE CREDENTIALS (same as login.html & booking.html)
        const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function initDashboard() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = session.user;
            document.getElementById('user-email-display').textContent = 'Signed in as: ' + currentUser.email;
            loadBookings();
        }

        async function loadBookings() {
            const loadingEl = document.getElementById('loading-state');
            const emptyEl = document.getElementById('empty-state');
            const listEl = document.getElementById('bookings-list');
            const statusEl = document.getElementById('status-msg');

            const { data, error } = await supabaseClient
                .from('bookings')
                .select('*')
                .eq('user_email', currentUser.email)
                .order('booking_date', { ascending: true });

            loadingEl.classList.add('hidden');

            if (error) {
                statusEl.className = 'mb-6 p-4 rounded-xl text-sm font-medium bg-red-100 text-red-700';
                statusEl.textContent = 'Error loading bookings: ' + error.message;
                statusEl.classList.remove('hidden');
                return;
            }

            if (!data || data.length === 0) {
                emptyEl.classList.remove('hidden');
                listEl.innerHTML = '';
                return;
            }

            emptyEl.classList.add('hidden');
            listEl.innerHTML = data.map(booking => {
                const dateObj = new Date(booking.booking_date);
                const formattedDate = dateObj.toLocaleDateString(undefined, {
                    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
                });
                const formattedTime = dateObj.toLocaleTimeString(undefined, {
                    hour: '2-digit', minute: '2-digit'
                });
                const isPast = dateObj < new Date();

                return `
                    <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full ${isPast ? 'bg-gray-100 text-gray-600' : 'bg-green-100 text-green-700'}">
                                    ${isPast ? 'Completed' : 'Upcoming'}
                                </span>
                                <span class="text-xs text-gray-400">ID: ${booking.id.slice(0, 8)}</span>
                            </div>
                            <h3 class="text-xl font-bold text-gray-800">${booking.subject}</h3>
                            <p class="text-green-600 font-semibold mt-1">Teacher: ${booking.teacher_name}</p>
                            <div class="mt-4 pt-4 border-t border-gray-100 text-sm text-gray-600 space-y-1">
                                <p>📅 <strong>Date:</strong> ${formattedDate}</p>
                                <p>⏰ <strong>Time:</strong> ${formattedTime}</p>
                            </div>
                        </div>
                        <div class="mt-6 flex justify-end">
                            <button onclick="cancelBooking('${booking.id}')" class="text-xs font-semibold text-red-600 hover:bg-red-50 px-3 py-2 rounded-lg transition">
                                Cancel Class
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function cancelBooking(id) {
            if (!confirm('Are you sure you want to cancel this scheduled class?')) return;
            const statusEl = document.getElementById('status-msg');
            const { error } = await supabaseClient.from('bookings').delete().eq('id', id);
            if (error) {
                statusEl.className = 'mb-6 p-4 rounded-xl text-sm font-medium bg-red-100 text-red-700';
                statusEl.textContent = 'Failed to cancel: ' + error.message;
                statusEl.classList.remove('hidden');
            } else {
                statusEl.className = 'mb-6 p-4 rounded-xl text-sm font-medium bg-green-100 text-green-700';
                statusEl.textContent = 'Class cancelled successfully.';
                statusEl.classList.remove('hidden');
                loadBookings();
            }
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        });

        initDashboard();
    </script>
</body>
</html>
